name: Application Windows

# Construit l'application de bureau Windows (exécutable + installateur) et la met à disposition
# dans l'onglet « Actions » (artefacts). Une version publiée (tag v*) joint aussi l'installateur à la release.
on:
  workflow_dispatch:
    inputs:
      version_publiee:
        description: "Publier une version (ex. v2.0.0) : crée le tag et la Release avec l'installateur. Laisser vide pour une simple construction."
        required: false
        default: ""
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
    paths:
      - "analyse_cb/**"
      - "config/**"
      - "modeles/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/application-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tesseract OCR (langue française) intégré à l'application
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" -OutFile "tesseract\tessdata\fra.traineddata"
          if (-not (Test-Path "tesseract\tessdata\osd.traineddata")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata" -OutFile "tesseract\tessdata\osd.traineddata"
          }
          Remove-Item tesseract\*.html, tesseract\doc -Recurse -Force -ErrorAction SilentlyContinue
          & tesseract\tesseract.exe --list-langs --tessdata-dir tesseract\tessdata

      - name: Tests
        run: |
          python exemples/generer_exemple.py
          python -m pytest -q

      - name: Construction de l'exécutable (PyInstaller)
        run: pyinstaller packaging/AnalyseRapportsCB.spec --noconfirm

      - name: Vérification de l'exécutable (analyse d'un rapport d'exemple)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--ligne-de-commande", "exemples\rapport_exemple_conforme.docx", "--decret", "exemples\decret_creation_ANEX.pdf", "--situation", "exemples\situation_execution_30062099.xlsx", "-o", "verification") -Wait -PassThru
          if (-not (Test-Path "verification\Analyse_rapport_exemple_conforme.xlsx")) { throw "Le fichier d'analyse n'a pas été produit (code $($p.ExitCode))." }
          Write-Host "Exécutable vérifié."

      - name: Vérification de l'interface (serveur local intégré à l'exécutable)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--test-serveur", "test_serveur.txt") -Wait -PassThru
          Get-Content test_serveur.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "L'interface n'est pas servie correctement par l'exécutable (code $($p.ExitCode))." }
          Write-Host "Interface vérifiée."

      - name: Vérification de la fenêtre de l'application (Edge WebView2)
        id: fenetre
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--test-fenetre", "test_fenetre.txt") -Wait -PassThru
          Get-Content test_fenetre.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Fenêtre non vérifiée sur cette machine (code $($p.ExitCode))." }
          Write-Host "Fenêtre de l'application vérifiée."

      # Étape témoin : « réussie » seulement si la fenêtre a bien affiché l'interface (sinon « ignorée »).
      - name: Fenêtre de l'application vérifiée (interface affichée par Edge WebView2)
        if: steps.fenetre.outcome == 'success'
        shell: pwsh
        run: Write-Host "La fenêtre de l'application affiche l'interface."

      - name: Vérification de la bascule automatique vers le navigateur
        id: repli
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--test-repli", "test_repli.txt") -Wait -PassThru
          Get-Content test_repli.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Bascule non vérifiée (code $($p.ExitCode))." }

      - name: Bascule vers le navigateur vérifiée
        if: steps.repli.outcome == 'success'
        shell: pwsh
        run: Write-Host "La fenêtre vide est refermée et l'application bascule sur le navigateur."

      - name: Vérification de l'OCR intégré (décret d'exemple « scanné »)
        shell: pwsh
        run: |
          python -c "import pypdfium2 as p; d=p.PdfDocument('exemples/decret_creation_ANEX.pdf'); im=[d[i].render(scale=200/72, grayscale=True).to_pil().convert('L') for i in range(len(d))]; im[0].save('decret_scanne.pdf','PDF',resolution=200,save_all=True,append_images=im[1:])"
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--ligne-de-commande", "exemples\rapport_exemple_conforme.docx", "--decret", "decret_scanne.pdf", "-o", "verification_ocr") -Wait -PassThru
          python -c "import openpyxl,sys; wb=openpyxl.load_workbook('verification_ocr/Analyse_rapport_exemple_conforme.xlsx'); v=' '.join(str(c.value) for r in wb['Décret de création'].iter_rows() for c in r if c.value); sys.exit(0 if '2099-001' in v else 'OCR du décret scanné non concluant')"
          Write-Host "OCR intégré vérifié (décret scanné lu par l'exécutable)."

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import analyse_cb; print(analyse_cb.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersionApp=$version" packaging\installateur.iss
          Compress-Archive -Path dist\AnalyseRapportsCB -DestinationPath "installateur\AnalyseRapportsCB-portable-$version.zip"
          Get-ChildItem installateur

      - uses: actions/upload-artifact@v4
        with:
          name: AnalyseRapportsCB-Windows
          path: installateur/*
          retention-days: 90

      - name: Publication de la version (Release GitHub)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version_publiee != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_publiee || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Analyse des rapports des CB – ${{ inputs.version_publiee || github.ref_name }}
          body: |
            Application Windows d'analyse des rapports des Contrôleurs Budgétaires (canevas DCB, décret de création, situation d'exécution).

            - **AnalyseRapportsCB-Installation-….exe** : installateur (sans droits d'administrateur ; raccourcis menu Démarrer et Bureau ; lecture des documents scannés intégrée).
            - **AnalyseRapportsCB-portable-….zip** : version portable, à décompresser puis lancer `AnalyseRapportsCB.exe`.

            Au premier lancement, Windows SmartScreen peut afficher un avertissement (application non signée) : « Informations complémentaires » puis « Exécuter quand même ».
          files: installateur/*
