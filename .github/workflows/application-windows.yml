name: Application Windows

# Construit l'application de bureau Windows (exécutable + installateur) et la met à disposition
# dans l'onglet « Actions » (artefacts). Une version publiée (tag v*) joint aussi l'installateur à la release.
on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
    paths:
      - "analyse_cb/**"
      - "config/**"
      - "modeles/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/application-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tesseract OCR (langue française) intégré à l'application
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item "$src\*" tesseract -Recurse -Force
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" -OutFile "tesseract\tessdata\fra.traineddata"
          if (-not (Test-Path "tesseract\tessdata\osd.traineddata")) {
            Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata" -OutFile "tesseract\tessdata\osd.traineddata"
          }
          Remove-Item tesseract\*.html, tesseract\doc -Recurse -Force -ErrorAction SilentlyContinue
          & tesseract\tesseract.exe --list-langs --tessdata-dir tesseract\tessdata

      - name: Tests
        run: |
          python exemples/generer_exemple.py
          python -m pytest -q

      - name: Construction de l'exécutable (PyInstaller)
        run: pyinstaller packaging/AnalyseRapportsCB.spec --noconfirm

      - name: Vérification de l'exécutable (analyse d'un rapport d'exemple)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AnalyseRapportsCB\AnalyseRapportsCB.exe" -ArgumentList @("--ligne-de-commande", "exemples\rapport_exemple_conforme.docx", "--decret", "exemples\decret_creation_ANEX.pdf", "--situation", "exemples\situation_execution_30062099.xlsx", "-o", "verification") -Wait -PassThru
          if (-not (Test-Path "verification\Analyse_rapport_exemple_conforme.xlsx")) { throw "Le fichier d'analyse n'a pas été produit (code $($p.ExitCode))." }
          Write-Host "Exécutable vérifié."

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import analyse_cb; print(analyse_cb.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersionApp=$version" packaging\installateur.iss
          Compress-Archive -Path dist\AnalyseRapportsCB -DestinationPath "installateur\AnalyseRapportsCB-portable-$version.zip"
          Get-ChildItem installateur

      - uses: actions/upload-artifact@v4
        with:
          name: AnalyseRapportsCB-Windows
          path: installateur/*
          retention-days: 90

      - name: Publication (versions taguées v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installateur/*
